[package]
name = "venera_js_host"
version = "0.1.0"
edition = "2021"

[dependencies]
rquickjs = { version = "0.9", features = ["array-buffer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["gzip"] }
scraper = "0.22"
ego-tree = "0.10"
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
rsa = "0.9"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v1"] }
rand = "0.8"
cookie = "0.18"
time = "0.3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
