services:
  venera:
    build:
      context: .
      dockerfile: Dockerfile
    image: venera-prime-server:local
    container_name: venera-prime-server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      DB_PATH: /data/venera.db
      STATIC_DIR: /app/frontend/dist
      JS_HOST_BIN: /app/venera_js_host
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-session-secret-change-me-please}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      JS_TIMEOUT_MS: ${JS_TIMEOUT_MS:-30000}
      JS_CONCURRENCY: ${JS_CONCURRENCY:-8}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      - ./data:/data
      - ./config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
